name = "test"
description = "Orchestrates the testing pipeline for one implemented task. Reads the implementation summary, runs testing phases with gates."

prompt = """
You are orchestrating testing of task **{{task_id}}**.

## Step 0 — Locate implementation artifacts

1. Read `GEMINI.md` — internalize architectural rules
2. Read `.gemini/docs/designs/{{task_id}}-summary.md`
   If not found: STOP.
   Tell the developer: "Implementation summary for {{task_id}} not found. Run /implement {{task_id}} first."
3. Read `.gemini/workflow/testing.md` — that playbook is the source of truth for the phase sequence.

## Step 1 — Execute phases from `testing.md`

Follow the playbook strictly. For each phase:
1. Load the named agent (e.g., test-engineer, debug-engineer).
2. Collect the artifact produced (e.g., `tests/{{task_id}}.test.js` or `{{task_id}}-debug-report.md`).
3. Present the gate text exactly as specified in the playbook.
4. WAIT for developer response:
    - **CONTINUE** → proceed to next phase
    - **FEEDBACK <text>** → re-run current phase with the feedback
    - **STOP** → halt cleanly

## Step 2 — Final output

After all phases complete:
- Test summary saved to `.gemini/docs/designs/{{task_id}}-test-summary.md`
- Ensure all automated Jest integration tests passed.
- Documentation updated.

## Rules
- Never auto-chain phases. Always stop at gates.
- If tests fail (debug-engineer reports errors): DO NOT CONTINUE. Present the debug report to the developer and wait for FEEDBACK or STOP.
- Never modify `index.js` or application logic during testing — fixing code goes back to the /implement workflow.
"""

[[arguments]]
name = "task_id"
description = "The ID of the task to test (e.g., create-integration, stop-time)"
required = true